<title>Asymschool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f3f1ec;
    --ink: #17181c;
    --muted: #5c5f68;
    --line: #d9d6cd;
    --ig: #e1306c;
    --ig-2: #f58529;
    --fb: #1877f2;
    --card: #ffffff;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #131418;
      --ink: #f2f0ea;
      --muted: #a3a6b0;
      --line: #2c2e36;
      --card: #1c1d23;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #131418;
    --ink: #f2f0ea;
    --muted: #a3a6b0;
    --line: #2c2e36;
    --card: #1c1d23;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 40px 32px;
    min-height: 100vh;
  }
  main { max-width: 480px; margin-inline: auto; }

  .mark {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.6rem, 13vw, 3.6rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .mark span { display: block; }
  .mark span + span { margin-left: 0.9em; color: var(--muted); font-weight: 500; }

  .lead {
    margin: 22px 0 32px;
    color: var(--muted);
    max-width: 30ch;
  }

  .links { display: grid; gap: 14px; }

  .link {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: var(--ink); }
  .link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .link:nth-child(2) { margin-left: 18px; }

  .icon {
    width: 52px; height: 52px;
    border-radius: 13px;
    display: grid; place-items: center;
    color: #fff;
  }
  .icon svg { width: 28px; height: 28px; fill: currentColor; }
  .ig .icon { background: linear-gradient(135deg, var(--ig-2), var(--ig) 55%, #8a3ab9); }
  .fb .icon { background: var(--fb); }

  .name { font-family: var(--display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.15; }
  .handle { color: var(--muted); font-size: 0.95rem; }
  .arrow { font-size: 1.4rem; color: var(--muted); }

  footer { margin-top: 36px; color: var(--muted); font-size: 0.9rem; }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>

      </span>
      <span>
